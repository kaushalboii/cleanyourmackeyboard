name: Release macOS App

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build:
    name: Build and Package macOS App
    runs-on: macos-latest
    permissions:
      contents: write # Required to create release and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode version
        # You can specify a particular Xcode version if needed
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Build macOS App
        run: |
          xcodebuild -project cleanyourmackeyboard.xcodeproj \
                     -scheme cleanyourmackeyboard \
                     -configuration Release \
                     -derivedDataPath ./build_derived \
                     clean build

      - name: Package App into ZIP
        run: |
          # Locate the built .app folder
          BUILT_APP_PATH=$(find ./build_derived -name "CleanYourMacKeyboard.app" -type d | head -n 1)
          if [ -z "$BUILT_APP_PATH" ] || [ ! -d "$BUILT_APP_PATH" ]; then
            echo "❌ Error: CleanYourMacKeyboard.app not found!"
            exit 1
          fi
          
          # Move to products directory to zip cleanly without absolute path structures
          cd "$(dirname "$BUILT_APP_PATH")"
          zip -q -r "${{ github.workspace }}/CleanMacKeyboard.zip" "CleanYourMacKeyboard.app"
          cd - > /dev/null
          
          echo "✅ ZIP package created at ${{ github.workspace }}/CleanMacKeyboard.zip"

      - name: Create DMG package (Alternative option for users)
        run: |
          BUILT_APP_PATH=$(find ./build_derived -name "CleanYourMacKeyboard.app" -type d | head -n 1)
          # Create a temp directory for DMG contents
          DMG_TEMP="${{ github.workspace }}/dmg_temp"
          mkdir -p "$DMG_TEMP"
          cp -R "$BUILT_APP_PATH" "$DMG_TEMP/"
          # Create symbolic link to /Applications inside the DMG
          ln -s /Applications "$DMG_TEMP/Applications"
          
          hdiutil create -volname "CleanMacKeyboard" -srcfolder "$DMG_TEMP" -ov -format UDZO "${{ github.workspace }}/CleanMacKeyboard.dmg"
          echo "✅ DMG package created at ${{ github.workspace }}/CleanMacKeyboard.dmg"


      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CleanMacKeyboard.zip
            CleanMacKeyboard.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
